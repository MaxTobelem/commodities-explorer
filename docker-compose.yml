# Local development: Postgres only. Run Django (uv run runserver) and Vite
# (npm run dev) natively for fast hot-reload. See README.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: commodities
      POSTGRES_USER: commodities
      POSTGRES_PASSWORD: commodities
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commodities"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
