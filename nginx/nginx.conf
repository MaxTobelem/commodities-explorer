server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Forwarded to the Django backend (inherited by the proxied locations below).
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Django: API, admin, and its static files (served by gunicorn + WhiteNoise).
    location /api/    { proxy_pass http://backend:8000; }
    location /admin/  { proxy_pass http://backend:8000; }
    location /static/ { proxy_pass http://backend:8000; }

    # Built SPA assets (hashed) — long cache.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA client-side routing fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
