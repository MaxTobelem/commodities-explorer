[project]
name = "commodities-explorer-backend"
version = "0.1.0"
description = "Backend Django — dashboard d'exploration des matières premières"
requires-python = ">=3.12"
dependencies = [
    "babel>=2.18.0",
    "deep-translator>=1.11.4",
    "dj-database-url>=3.1.2",
    "django>=5.2,<6.0",
    "django-filter>=25.2",
    "django-unfold>=0.97.0",
    "djangorestframework>=3.17.1",
    "gunicorn>=26.0.0",
    "numpy>=2.5.0",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.3.4",
    "pycountry>=26.2.16",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "whitenoise>=6.12.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "DJ"]
ignore = ["E501"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-django>=4.12.0",
    "responses>=0.26.1",
    "ruff>=0.15.16",
]
